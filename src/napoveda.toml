schema_version = "1.0.0"
[promenne]
autor = "Martin"
nazevfunkce = "_nazevFunkce_"
nazevbalicku = "_nazevBalicku_"

[templates]
funkce_jl = """
# ver: {date}
## Funkce {nazevfunkce}()
## Autor: {autor}
## Funkce Julia v{julia_version}
#
## Cesta uvnitř balíčku:
# {nazevbalicku}/src/{nazevfunkce}.jl
## Použité balíčky:
#
## Použité uživatelské funkce:
#
###############################################################
## Použité proměnné vnitřní:
#
using {nazevbalicku}
{obsah_funkce}
function {nazevfunkce}(vstupni_promenne)
# -----------------------------------------------------------------------
# vnitřní funkce start
# -----------------------------------------------------------------------

# -----------------------------------------------------------------------
# vnitřní funkce konec
# -----------------------------------------------------------------------
    _popisFunkce_
    return vystupni_promenne
end # konec funkce {nazevfunkce}
"""

funkce_md = """
## funkce `{nazevfunkce}`
## soubor `{nazevfunkce}.jl`
###############################################################
## Popis funkce:
_popisFunkce_
## Vzor:
vystupni_promenne = {nazevfunkce}(vstupni_promenne)
## Vstupní proměnné:
- `promenna` - popis_promenne
## Výstupní proměnné:
- `promenna` - popis_promenne
## Příklad:
```julia
_priklad_pouziti_funkce_
```
"""

balicek_jl = """
## Balíček Julia v{julia_version}
###############################################################
## Popis balíčku
#
# ver: {date}
## Autor: {autor}
#
## Cesta uvnitř balíčku:
# {nazevbalicku}/src/{nazevbalicku}.jl
#
## Použité balíčky:
#
###############################################################
## Použité proměnné vnitřní:
#
{obsah_balicku}
module {nazevbalicku}
include("{nazevfunkce}.jl")
export {nazevfunkce}
end # konec modulu {nazevbalicku}
"""

balicek_md = """
# {nazevbalicku}
`{nazevbalicku}` je balíček v jazyce Julia _popisBalicku_

## Instalace

Balíček lze nainstalovat přes správce balíčků Julia:

```julia
using Pkg
Pkg.add(url="https://github.com/markrcmarik-beep/{nazevbalicku}")
```

## Rychlý start

```julia
using {nazevbalicku}
```

## Hlavní exportované funkce

- {nazevfunkce} - _popisFunkce_
"""

data_toml = """
schema_version = "1.0.0"
"""
